name: One-shot foundation patch

on:
  push:
    branches:
      - feat/upstream-completion-20260811

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[foundation-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upstream-completion-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/one_shot_foundation_patch.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: establish player modal stack and glass quality picker [foundation-applied]"
          git push origin HEAD:feat/upstream-completion-20260811
