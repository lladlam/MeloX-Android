name: Apply phase2 parity fixes
on:
  push:
    branches:
      - fix/lyrics-queue-backdrop-20260811
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lyrics-queue-backdrop-20260811
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/phase2_parity_fix.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/kotlin
          git commit -m 'feat: add custom lyrics renderer and parity polish'
          git push origin HEAD:fix/lyrics-queue-backdrop-20260811
