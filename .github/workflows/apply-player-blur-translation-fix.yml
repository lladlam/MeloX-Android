name: Apply player blur translation fix

on:
  push:
    branches:
      - fix/blur-layout-translation-miniplayer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blur-layout-translation-miniplayer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/apply_player_blur_translation_fix.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct player blur, lyric handoff and compact controls"
          git push origin HEAD:fix/blur-layout-translation-miniplayer
