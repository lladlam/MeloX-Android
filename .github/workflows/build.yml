name: Build

on:
  push:
    branches:
      - main
      - debug/one-time-issue-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      # A release asset downloads without a GitHub login, unlike an Actions artifact.
      # The fixed tag and fixed file name mean every build replaces the same file, so
      # nothing accumulates and no retention policy is needed.
      - name: Publish rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/MeloX-Android-debug.apk
          gh release view dev-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create dev-latest --repo "${GITHUB_REPOSITORY}" \
                 --prerelease --title "Development build" \
                 --notes "Rolling debug build, overwritten on every push to main."
          gh release upload dev-latest /tmp/MeloX-Android-debug.apk \
            --clobber --repo "${GITHUB_REPOSITORY}"
