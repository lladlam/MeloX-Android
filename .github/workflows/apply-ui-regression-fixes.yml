name: Apply UI regression fixes

on:
  push:
    branches:
      - fix/playlist-lyrics-settings-20260811
    paths:
      - tools/apply_ui_regression_fixes.py
      - .github/workflows/apply-ui-regression-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-lyrics-settings-20260811
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_ui_regression_fixes.py
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(ui): preserve modal layering and settings scroll state"
          git push origin HEAD:fix/playlist-lyrics-settings-20260811
