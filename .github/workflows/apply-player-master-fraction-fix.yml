name: Apply master-fraction player transition fix

on:
  push:
    branches: [fix/player-master-fraction-20260811]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply player transition patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('android/app/src/main/kotlin/com/lladlam/melox/ui/MeloXApp.kt')
          text = app.read_text()
          text = text.replace(
              'playerTransitionState.animateTo(targetState = true)',
              'playerTransitionState.animateTo(\n                    targetState = true,\n                    animationSpec = playerFractionSpec(),\n                )',
          )
          text = text.replace(
              'playerTransitionState.animateTo(targetState = false)',
              'playerTransitionState.animateTo(\n                targetState = false,\n                animationSpec = playerFractionSpec(),\n            )',
          )
          text = text.replace(
              'playerTransitionState.animateTo(targetState = !collapse)',
              'playerTransitionState.animateTo(\n                            targetState = !collapse,\n                            animationSpec = playerFractionSpec(),\n                        )',
          )
          marker = '\nprivate fun smoothStep(value: Float, start: Float, end: Float): Float {'
          helper = '''\nprivate fun playerFractionSpec() = spring<Float>(\n    dampingRatio = 1.0f,\n    stiffness = 380f,\n    visibilityThreshold = 0.001f,\n)\n'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('MeloXApp helper insertion marker missing')
              text = text.replace(marker, helper + marker, 1)
          app.write_text(text)

          spec = Path('android/app/src/main/kotlin/com/lladlam/melox/ui/player/MeloXPlayerTransitionSpec.kt')
          spec.write_text('''package com.lladlam.melox.ui.player\n\nimport androidx.compose.animation.BoundsTransform\nimport androidx.compose.animation.core.LinearEasing\nimport androidx.compose.animation.core.tween\n\n// SharedTransition defaults to a spring bounds transform. For an interactive\n// seekable transition that makes different children advance by different\n// apparent amounts. Use one linear child timeline and animate only the master\n// SeekableTransitionState fraction when the gesture is released.\ninternal const val MeloXPlayerTransitionDurationMillis = 1000\n\ninternal val MeloXPlayerLinearBoundsTransform = BoundsTransform { _, _ ->\n    tween(\n        durationMillis = MeloXPlayerTransitionDurationMillis,\n        easing = LinearEasing,\n    )\n}\n\ninternal fun meloXPlayerLinearFloatSpec() = tween<Float>(\n    durationMillis = MeloXPlayerTransitionDurationMillis,\n    easing = LinearEasing,\n)\n''')

          mini = Path('android/app/src/main/kotlin/com/lladlam/melox/ui/player/MeloXIOSMiniPlayer.kt')
          text = mini.read_text()
          old = '''transitionSpec = {\n                spring(\n                    dampingRatio = 0.90f,\n                    stiffness = 320f,\n                    visibilityThreshold = 0.001f,\n                )\n            },'''
          if old not in text:
              raise SystemExit('MiniPlayer expansion transition target missing')
          text = text.replace(old, 'transitionSpec = { meloXPlayerLinearFloatSpec() },', 1)
          old = '''exit = ExitTransition.None,\n                    resizeMode = SharedTransitionScope.ResizeMode.RemeasureToBounds,'''
          new = '''exit = ExitTransition.None,\n                    boundsTransform = MeloXPlayerLinearBoundsTransform,\n                    resizeMode = SharedTransitionScope.ResizeMode.RemeasureToBounds,'''
          if old not in text:
              raise SystemExit('MiniPlayer sharedBounds target missing')
          text = text.replace(old, new, 1)
          old = '''sharedContentState = rememberSharedContentState(\n                                    key = sharedArtworkKey(state.mediaId),\n                                ),\n                                animatedVisibilityScope = animatedVisibilityScope,\n                            )'''
          new = '''sharedContentState = rememberSharedContentState(\n                                    key = sharedArtworkKey(state.mediaId),\n                                ),\n                                animatedVisibilityScope = animatedVisibilityScope,\n                                boundsTransform = MeloXPlayerLinearBoundsTransform,\n                                zIndexInOverlay = 3f,\n                            )'''
          if old not in text:
              raise SystemExit('MiniPlayer sharedElement target missing')
          text = text.replace(old, new, 1)
          mini.write_text(text)

          host = Path('android/app/src/main/kotlin/com/lladlam/melox/ui/player/MeloXIOSNowPlayingSharedHost.kt')
          text = host.read_text()
          old = '''transitionSpec = {\n            spring(\n                dampingRatio = 0.90f,\n                stiffness = 320f,\n                visibilityThreshold = 0.001f,\n            )\n        },'''
          if old not in text:
              raise SystemExit('Host expansion transition target missing')
          text = text.replace(old, 'transitionSpec = { meloXPlayerLinearFloatSpec() },', 1)
          text = text.replace(
              'val dragRangePx = (constraints.maxHeight * 0.72f).coerceAtLeast(1f)',
              'val dragRangePx = (constraints.maxHeight * 0.86f).coerceAtLeast(1f)',
              1,
          )
          old = '''exit = ExitTransition.None,\n            resizeMode = SharedTransitionScope.ResizeMode.RemeasureToBounds,'''
          new = '''exit = ExitTransition.None,\n            boundsTransform = MeloXPlayerLinearBoundsTransform,\n            resizeMode = SharedTransitionScope.ResizeMode.RemeasureToBounds,'''
          if old not in text:
              raise SystemExit('Host sharedBounds target missing')
          text = text.replace(old, new, 1)
          old = '''            SharedArtworkDestination(\n                state = state,\n                page = page,\n                expansionProgress = expansionProgress,\n                sharedTransitionScope = sharedTransitionScope,\n                animatedVisibilityScope = animatedVisibilityScope,\n            )\n        }\n    }\n}'''
          new = '''        }\n\n        // Keep the artwork destination in the stable SharedTransition root\n        // coordinate space. Nesting it inside the remeasured sharedBounds made\n        // its target move while the artwork itself was also transforming.\n        SharedArtworkDestination(\n            state = state,\n            page = page,\n            expansionProgress = expansionProgress,\n            sharedTransitionScope = sharedTransitionScope,\n            animatedVisibilityScope = animatedVisibilityScope,\n        )\n    }\n}'''
          if old not in text:
              raise SystemExit('Host artwork move target missing')
          text = text.replace(old, new, 1)
          old = '''sharedContentState = rememberSharedContentState(\n                            key = sharedArtworkKey(state.mediaId),\n                        ),\n                        animatedVisibilityScope = animatedVisibilityScope,\n                    )'''
          new = '''sharedContentState = rememberSharedContentState(\n                            key = sharedArtworkKey(state.mediaId),\n                        ),\n                        animatedVisibilityScope = animatedVisibilityScope,\n                        boundsTransform = MeloXPlayerLinearBoundsTransform,\n                        zIndexInOverlay = 3f,\n                    )'''
          if old not in text:
              raise SystemExit('Host sharedElement target missing')
          text = text.replace(old, new, 1)
          host.write_text(text)
          PY
      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
      - name: Commit fix and clean temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-player-master-fraction-fix.yml
          git add android/app/src/main/kotlin/com/lladlam/melox/ui/MeloXApp.kt \
                  android/app/src/main/kotlin/com/lladlam/melox/ui/player/MeloXIOSMiniPlayer.kt \
                  android/app/src/main/kotlin/com/lladlam/melox/ui/player/MeloXIOSNowPlayingSharedHost.kt \
                  android/app/src/main/kotlin/com/lladlam/melox/ui/player/MeloXPlayerTransitionSpec.kt
          git commit -m "fix(player): drive shared transition from one master fraction"
          git push origin HEAD:fix/player-master-fraction-20260811
