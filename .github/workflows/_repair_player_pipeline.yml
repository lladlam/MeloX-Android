name: Apply player pipeline repair
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/player-queue-crossfade-download-lyrics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply repair
        run: python3 tools/_repair_player_pipeline.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebuild queue, crossfade, downloads and lyrics"
          git push origin HEAD:${{ github.head_ref }}
