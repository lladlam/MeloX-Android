name: Apply AndroidLiquidGlass Controls

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'refactor/android-liquid-glass-controls'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/android-liquid-glass-controls
          fetch-depth: 0

      - name: Migrate playlist glass controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('android/app/src/main/kotlin/com/lladlam/melox/ui/library/LibraryScreen.kt')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(old, new, 1)

          replace_once(
              'import coil3.compose.AsyncImage\n',
              'import coil3.compose.AsyncImage\n'
              'import com.kyant.backdrop.backdrops.LayerBackdrop\n'
              'import com.kyant.backdrop.backdrops.layerBackdrop\n'
              'import com.kyant.backdrop.backdrops.rememberLayerBackdrop\n',
              'Kyant imports',
          )
          replace_once(
              'import com.lladlam.melox.playback.PlaybackCommands\n',
              'import com.lladlam.melox.playback.PlaybackCommands\n'
              'import com.lladlam.melox.ui.glass.meloXLiquidGlass\n',
              'glass modifier import',
          )

          replace_once(
              '''    Box(\n        modifier = Modifier\n            .fillMaxSize()\n            .background(Color.Black),\n    ) {\n        // Use the exact same artwork-driven background renderer as the full\n        // now-playing artwork page: 160px artwork -> 3x3 palette -> flowing fields.\n        MeloXFlowingLightBackdrop(\n            artworkUrl = displayed.coverUrl,\n            isPlaying = false,\n            modifier = Modifier.fillMaxSize(),\n        )\n''',
              '''    // Glass controls in playlist detail cannot sample the app-root backdrop,\n    // because they live inside that recording layer. Capture only this page's\n    // artwork-driven background once and let every detail control share it.\n    val detailGlassBackdrop = rememberLayerBackdrop()\n\n    Box(\n        modifier = Modifier\n            .fillMaxSize()\n            .background(Color.Black),\n    ) {\n        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .layerBackdrop(detailGlassBackdrop),\n        ) {\n            MeloXFlowingLightBackdrop(\n                artworkUrl = displayed.coverUrl,\n                isPlaying = false,\n                modifier = Modifier.fillMaxSize(),\n            )\n        }\n''',
              'detail backdrop',
          )

          replace_once(
              '''            MeloXPlaylistToolbar(\n                foreground = foreground,\n                onBack = onBack,\n            )''',
              '''            MeloXPlaylistToolbar(\n                foreground = foreground,\n                backdrop = detailGlassBackdrop,\n                onBack = onBack,\n            )''',
              'toolbar call',
          )
          replace_once(
              '''            MeloXPlaylistSearchField(\n                value = searchQuery,\n                onValueChange = { searchQuery = it },\n                foreground = foreground,''',
              '''            MeloXPlaylistSearchField(\n                value = searchQuery,\n                onValueChange = { searchQuery = it },\n                foreground = foreground,\n                backdrop = detailGlassBackdrop,''',
              'search call',
          )
          replace_once(
              '''                        secondary = secondary,\n                        onPlay = {''',
              '''                        secondary = secondary,\n                        backdrop = detailGlassBackdrop,\n                        onPlay = {''',
              'hero call',
          )

          replace_once(
              '''private fun MeloXPlaylistToolbar(\n    foreground: Color,\n    onBack: () -> Unit,''',
              '''private fun MeloXPlaylistToolbar(\n    foreground: Color,\n    backdrop: LayerBackdrop,\n    onBack: () -> Unit,''',
              'toolbar signature',
          )
          replace_once(
              '''        MeloXGlassCircleButton(\n            foreground = foreground,\n            size = 44.dp,''',
              '''        MeloXGlassCircleButton(\n            foreground = foreground,\n            backdrop = backdrop,\n            size = 44.dp,''',
              'toolbar back glass',
          )
          replace_once(
              '''            modifier = Modifier\n                .height(44.dp)\n                .clip(RoundedCornerShape(22.dp))\n                .background(glassColor(foreground))\n                .padding(horizontal = 4.dp),''',
              '''            modifier = Modifier\n                .height(44.dp)\n                .meloXLiquidGlass(\n                    backdrop = backdrop,\n                    shape = RoundedCornerShape(22.dp),\n                    tint = glassTint(foreground),\n                    fallbackTint = glassColor(foreground),\n                    blurRadius = 6.dp,\n                    refractionHeight = 9.dp,\n                    refractionAmount = 11.dp,\n                    highlightAlpha = 0.14f,\n                    shadowAlpha = 0.08f,\n                )\n                .clip(RoundedCornerShape(22.dp))\n                .padding(horizontal = 4.dp),''',
              'toolbar action pill',
          )

          replace_once(
              '''private fun MeloXPlaylistSearchField(\n    value: String,\n    onValueChange: (String) -> Unit,\n    foreground: Color,\n    modifier: Modifier = Modifier,''',
              '''private fun MeloXPlaylistSearchField(\n    value: String,\n    onValueChange: (String) -> Unit,\n    foreground: Color,\n    backdrop: LayerBackdrop,\n    modifier: Modifier = Modifier,''',
              'search signature',
          )
          replace_once(
              '''        modifier = modifier\n            .fillMaxWidth()\n            .height(44.dp)\n            .clip(RoundedCornerShape(22.dp))\n            .background(glassColor(foreground)),''',
              '''        modifier = modifier\n            .fillMaxWidth()\n            .height(44.dp)\n            .meloXLiquidGlass(\n                backdrop = backdrop,\n                shape = RoundedCornerShape(22.dp),\n                tint = glassTint(foreground),\n                fallbackTint = glassColor(foreground),\n                blurRadius = 7.dp,\n                refractionHeight = 8.dp,\n                refractionAmount = 10.dp,\n                highlightAlpha = 0.12f,\n                shadowAlpha = 0.06f,\n            )\n            .clip(RoundedCornerShape(22.dp)),''',
              'search glass',
          )

          replace_once(
              '''    foreground: Color,\n    secondary: Color,\n    onPlay: () -> Unit,''',
              '''    foreground: Color,\n    secondary: Color,\n    backdrop: LayerBackdrop,\n    onPlay: () -> Unit,''',
              'hero signature',
          )
          # Hero has two circle buttons after the toolbar back button. Patch both.
          old = '''                MeloXGlassCircleButton(\n                    foreground = foreground,\n                    size = 54.dp,'''
          new = '''                MeloXGlassCircleButton(\n                    foreground = foreground,\n                    backdrop = backdrop,\n                    size = 54.dp,'''
          if text.count(old) < 2:
              raise SystemExit('hero circle glass anchors not found')
          text = text.replace(old, new, 2)

          replace_once(
              '''                Box(\n                    modifier = Modifier\n                        .width(140.dp)\n                        .height(50.dp)\n                        .clip(RoundedCornerShape(25.dp))\n                        .background(if (foreground == Color.White) Color.White else Color.Black)\n                        .clickable(enabled = tracks.isNotEmpty(), onClick = onPlay),''',
              '''                Box(\n                    modifier = Modifier\n                        .width(140.dp)\n                        .height(50.dp)\n                        .meloXLiquidGlass(\n                            backdrop = backdrop,\n                            shape = RoundedCornerShape(25.dp),\n                            tint = primaryGlassTint(foreground),\n                            fallbackTint = if (foreground == Color.White) Color.White else Color.Black,\n                            blurRadius = 6.dp,\n                            refractionHeight = 10.dp,\n                            refractionAmount = 12.dp,\n                            highlightAlpha = 0.18f,\n                            shadowAlpha = 0.10f,\n                        )\n                        .clip(RoundedCornerShape(25.dp))\n                        .clickable(enabled = tracks.isNotEmpty(), onClick = onPlay),''',
              'play glass',
          )

          replace_once(
              '''private fun MeloXGlassCircleButton(\n    foreground: Color,\n    size: androidx.compose.ui.unit.Dp,''',
              '''private fun MeloXGlassCircleButton(\n    foreground: Color,\n    backdrop: LayerBackdrop,\n    size: androidx.compose.ui.unit.Dp,''',
              'circle signature',
          )
          replace_once(
              '''        modifier = Modifier\n            .size(size)\n            .clip(CircleShape)\n            .background(glassColor(foreground))\n            .clickable(''',
              '''        modifier = Modifier\n            .size(size)\n            .meloXLiquidGlass(\n                backdrop = backdrop,\n                shape = CircleShape,\n                tint = glassTint(foreground),\n                fallbackTint = glassColor(foreground),\n                blurRadius = 6.dp,\n                refractionHeight = 9.dp,\n                refractionAmount = 11.dp,\n                highlightAlpha = 0.16f,\n                shadowAlpha = 0.08f,\n            )\n            .clip(CircleShape)\n            .clickable(''',
              'circle modifier',
          )

          replace_once(
              '''private fun glassColor(foreground: Color): Color =\n    if (foreground == Color.White) Color.Black.copy(alpha = 0.22f)\n    else Color.White.copy(alpha = 0.64f)\n''',
              '''private fun glassColor(foreground: Color): Color =\n    if (foreground == Color.White) Color.Black.copy(alpha = 0.46f)\n    else Color.White.copy(alpha = 0.58f)\n\nprivate fun glassTint(foreground: Color): Color =\n    if (foreground == Color.White) Color.Black.copy(alpha = 0.08f)\n    else Color.White.copy(alpha = 0.10f)\n\nprivate fun primaryGlassTint(foreground: Color): Color =\n    if (foreground == Color.White) Color.White.copy(alpha = 0.78f)\n    else Color.Black.copy(alpha = 0.78f)\n''',
              'glass colors',
          )

          path.write_text(text)

      - name: Commit migrated controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/kotlin/com/lladlam/melox/ui/library/LibraryScreen.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: use AndroidLiquidGlass for playlist controls"
          git push origin HEAD:refactor/android-liquid-glass-controls
