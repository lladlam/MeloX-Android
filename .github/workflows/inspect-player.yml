name: Inspect player state
on:
  push:
    branches:
      - fix/lyrics-queue-backdrop-20260811
  pull_request:
    branches:
      - main
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect symbols
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== playback state symbol ==='
          grep -RIn --include='*.kt' 'class MeloXPlaybackUiState\|data class MeloXPlaybackUiState\|fun rememberMeloXPlaybackUiState\|addCurrentToQueue\|addToQueue' android/app/src/main/kotlin || true
          echo '=== lyrics control symbols ==='
          grep -RIn --include='*.kt' 'show.*Lyrics.*Control\|lyrics.*auto.*hide\|isBrowsingLyrics\|FOLLOW_DELAY' android/app/src/main/kotlin || true
          echo '=== daily recommendation ==='
          grep -RIn --include='*.kt' '每日推荐\|daily.*recommend\|recommend.*daily' android/app/src/main/kotlin || true
          echo '=== download ==='
          grep -RIn --include='*.kt' 'download\|下载' android/app/src/main/kotlin || true
          echo '=== about ==='
          grep -RIn --include='*.kt' '关于 MeloX\|Android 原生迁移版\|查看上游 MeloX' android/app/src/main/kotlin || true
