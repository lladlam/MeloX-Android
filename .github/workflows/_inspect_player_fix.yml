name: Inspect player fix targets
on:
  push:
    branches:
      - fix/player-queue-crossfade-download-lyrics
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List relevant files
        run: |
          echo '=== FILES ==='
          find android/app/src/main/kotlin -type f | sort | grep -Ei 'playback|player|queue|lyric|download|setting|volume' || true
          echo '=== SETTINGS RUNTIME ==='
          grep -RIn "showLyricTranslation\|download.*lyric\|lyrics.*download\|MeloXSettingsRuntime" android/app/src/main/kotlin | head -200 || true
          echo '=== SHUFFLE ==='
          grep -RIn "shuffle\|Shuffle" android/app/src/main/kotlin/com/lladlam/melox | head -240 || true
          echo '=== VOLUME ==='
          grep -RIn "volume\|AudioManager" android/app/src/main/kotlin/com/lladlam/melox | head -240 || true
          echo '=== DOWNLOAD ==='
          grep -RIn "MeloXDownloadStore\|start(song\|artworkUrl\|lyrics" android/app/src/main/kotlin/com/lladlam/melox/core/download android/app/src/main/kotlin/com/lladlam/melox/ui | head -260 || true
